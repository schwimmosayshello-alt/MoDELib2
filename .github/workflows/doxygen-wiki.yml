# Procedure for adding auto documentation:
# 1: Add this file to /.github/workflows/ 
# 2: Add Doxyfile (and check Image_path if you want images)
# 3: Turn on read and write permissions in... 
#    settings -> actions -> general -> workflow permissions
# Finally, note that @mainpage will not work; you have to
#    instead use @page Home [MAINPAGE NAME]

name: Update Doxygen Wiki

on:
  push:
    branches: [ main ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          wget https://github.com/doxygen/doxygen/releases/download/Release_1_9_1/doxygen-1.9.1.linux.bin.tar.gz
          tar -xzf doxygen-1.9.1.linux.bin.tar.gz
          sudo cp doxygen-1.9.1/bin/doxygen /usr/local/bin/doxygen

          wget http://archive.ubuntu.com/ubuntu/pool/main/libf/libffi/libffi7_3.3-4_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/main/l/llvm-toolchain-9/libllvm9_9.0.1-12_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/universe/l/llvm-toolchain-9/libclang1-9_9.0.1-12_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/universe/l/llvm-toolchain-9/libclang-cpp9_9.0.1-12_amd64.deb
          sudo apt-get install -y ./libffi7_3.3-4_amd64.deb ./libllvm9_9.0.1-12_amd64.deb ./libclang1-9_9.0.1-12_amd64.deb ./libclang-cpp9_9.0.1-12_amd64.deb

          sudo apt-get update && sudo apt-get install -y graphviz
          doxygen --version
          
      - name: Install doxybook2
        run: |
          DOXYBOOK2_VERSION=$(curl -s https://api.github.com/repos/matusnovak/doxybook2/releases/latest | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sL "https://github.com/matusnovak/doxybook2/releases/download/${DOXYBOOK2_VERSION}/doxybook2-linux-amd64-${DOXYBOOK2_VERSION}.zip" -o doxybook2.zip
          unzip doxybook2.zip -d doxybook2
          sudo mv doxybook2/bin/doxybook2 /usr/local/bin/

      - name: Run Doxygen
        run: |
          cd doxygen/
          doxygen Doxyfile

      - name: Convert XML to Markdown
        run: |
          mkdir -p wiki-output
          mkdir -p doxybook-templates
          touch doxybook-templates/meta.tmpl
          doxybook2 --input doxygen/HTML/xml --output wiki-output --templates doxybook-templates
    
      - name: Checkout wiki repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Copy generated docs into wiki
        run: |
          rm -rf wiki/*
          cp -r wiki-output/Pages/* wiki/
          mkdir -p wiki/images
          cp -r doxygen/dox/Images/* wiki/images/
          
          if [ -f "wiki-output/index_classes.md" ]; then
            sed -n '/^# /,$p' wiki-output/index_classes.md \
              | sed -E 's#(Classes|Files|Namespaces|Examples|Modules)/##g; s/\.md#/#/g; s/\.md\)/\)/g' \
              | sed -E 's/\[[a-z]+\]\(([^)#]+)#/[\1]\(\1#/g' \
              > wiki/Classes.md
          fi
          
          if [ -d "wiki-output/Classes" ]; then
            for f in wiki-output/Classes/*.md; do
              cp "$f" wiki/
            done
          fi

          if [ -d "wiki-output/Namespaces" ]; then
            for f in wiki-output/Namespaces/*.md; do
              cp "$f" wiki/
            done
          fi
          
          if [ -f "wiki-output/index_files.md" ]; then
            sed -n '/^# /,$p' wiki-output/index_files.md \
              | sed -E 's#Files/##g; s/\.md#/#/g; s/\.md\)/\)/g' \
              | sed -E 's/\[[a-z]+\]\(([^)#]+)#/[\1]\(\1#/g' \
              > wiki/Files.md
          fi
          
          if [ -d "wiki-output/Files" ]; then
            for f in wiki-output/Files/*.md; do
              cp "$f" wiki/
            done
          fi
          
          if [ -f "wiki/_home.md" ]; then
            mv wiki/_home.md wiki/Home.md
          else
            echo "# Welcome to the Wiki" > wiki/Home.md
            echo "" >> wiki/Home.md
            echo "- [Classes](Classes)" >> wiki/Home.md
            echo "- [Files](Files)" >> wiki/Home.md
          fi
          
          {
            echo "- [Home](Home)"
            for f in wiki-output/Pages/*.md; do
              filename=$(basename "$f" .md)
              [ "$filename" == "_home" ] && continue
              title=$(grep -m 1 '^# ' "$f" | sed 's/^# //')
              [ -z "$title" ] && title="$filename"
              echo "- [$title]($filename)"
            done
            echo "- [Classes](Classes)"
            echo "- [Files](Files)"
          } > wiki/_Sidebar.md

          find wiki -name "*.md" -exec sed -i -E \
            -e 's#(Classes|Files|Namespaces|Examples|Modules|Pages)/##g' \
            -e 's/\.md#/#/g' \
            -e 's/\.md\)/\)/g' \
            {} \;
          
      - name: Commit and push wiki changes
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto-update docs from Doxygen ($GITHUB_SHA)"
          git push
